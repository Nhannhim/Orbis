[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-physical-ai"
version = "0.1.0"
description = "A proof-grounded orchestration layer for physical AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
orbis = "orbis.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

